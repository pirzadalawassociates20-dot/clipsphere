<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میری ٹک ٹاک ویب سائٹ</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* App Container (Mobile Frame) */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            background-color: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* Video Feed (Vertical Scroll Snap) */
        .video-feed {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* Firefox */
        }

        .video-feed::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* Video Card */
        .video-card {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background-color: #111;
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* Video Overlay Info (Bottom-Left) */
        .video-details {
            position: absolute;
            bottom: 75px;
            left: 15px;
            right: 80px;
            z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .username {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .caption {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .music-track {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        /* Sidebar Action Buttons (Right Side) */
        .sidebar {
            position: absolute;
            right: 12px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 10;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }

        .action-btn:active {
            transform: scale(1.2);
        }

        .icon-wrapper {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            margin-bottom: 4px;
            transition: color 0.3s ease, background 0.3s ease;
        }

        .action-btn.liked .icon-wrapper {
            color: #fe2c55;
            background: rgba(254, 44, 85, 0.2);
        }

        .count {
            font-size: 11px;
            font-weight: 600;
        }

        /* Footer Navigation Bar */
        .navbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 0.5px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8a8b91;
            font-size: 10px;
            gap: 4px;
            cursor: pointer;
        }

        .nav-link.active {
            color: #fff;
        }

        .nav-icon {
            font-size: 20px;
        }

        /* Center Create (+) Button */
        .add-btn {
            width: 45px;
            height: 28px;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 50%, #fe2c55 100%);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Video Feed -->
        <div class="video-feed" id="videoFeed">

            <!-- Video 1 -->
            <div class="video-card">
                <video class="video-player" loop onclick="togglePlay(this)">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                </video>
                
                <div class="video-details">
                    <div class="username">@tech_coder</div>
                    <div class="caption">میری پہلی ٹک ٹاک ویب سائٹ تیار ہو گئی! 🚀 #coding #webdev</div>
                    <div class="music-track">🎵 <span>Original Sound - @tech_coder</span></div>
                </div>

                <div class="sidebar">
                    <div class="action-btn" onclick="toggleLike(this, 12500)">
                        <div class="icon-wrapper">❤️</div>
                        <span class="count">12.5k</span>
                    </div>
                    <div class="action-btn">
                        <div class="icon-wrapper">💬</div>
                        <span class="count">842</span>
                    </div>
                    <div class="action-btn">
                        <div class="icon-wrapper">↪️</div>
                        <span class="count">شیئر</span>
                    </div>
                </div>
            </div>

            <!-- Video 2 -->
            <div class="video-card">
                <video class="video-player" loop onclick="togglePlay(this)">
                    <source src="https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4" type="video/mp4">
                </video>
                
                <div class="video-details">
                    <div class="username">@nature_hub</div>
                    <div class="caption">خوبصورت مناظر اور سکون ✨ #nature #peace</div>
                    <div class="music-track">🎵 <span>Relaxing Beats - Nature Sound</span></div>
                </div>

                <div class="sidebar">
                    <div class="action-btn" onclick="toggleLike(this, 45200)">
                        <div class="icon-wrapper">❤️</div>
                        <span class="count">45.2k</span>
                    </div>
                    <div class="action-btn">
                        <div class="icon-wrapper">💬</div>
                        <span class="count">1.2k</span>
                    </div>
                    <div class="action-btn">
                        <div class="icon-wrapper">↪️</div>
                        <span class="count">شیئر</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Navigation Bar -->
        <div class="navbar">
            <div class="nav-link active">
                <span class="nav-icon">🏠</span>
                <span>ہوم</span>
            </div>
            <div class="nav-link">
                <span class="nav-icon">🔍</span>
                <span>تلاش</span>
            </div>
            <div class="nav-link">
                <div class="add-btn">+</div>
            </div>
            <div class="nav-link">
                <span class="nav-icon">💬</span>
                <span>ان باکس</span>
            </div>
            <div class="nav-link">
                <span class="nav-icon">👤</span>
                <span>پروفائل</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Video Play/Pause on Click
        function togglePlay(video) {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        // Like Button Toggle & Counter
        function toggleLike(element, initialCount) {
            const countSpan = element.querySelector('.count');
            const isLiked = element.classList.contains('liked');

            if (isLiked) {
                element.classList.remove('liked');
                countSpan.innerText = (initialCount / 1000).toFixed(1) + 'k';
            } else {
                element.classList.add('liked');
                countSpan.innerText = ((initialCount + 1) / 1000).toFixed(1) + 'k';
            }
        }
    </script>
</body>
</html>
